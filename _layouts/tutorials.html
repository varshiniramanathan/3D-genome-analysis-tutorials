---
layout: default
---

<div class="tutorial-container">

  <aside class="tutorial-sidebar">

    <h3>Tutorial</h3>

    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>

      <a href="{{ '/01-introduction.html' | relative_url }}">
        1. Introduction
      </a>

      <a href="{{ '/02-getting-started.html' | relative_url }}">
        2. Getting Started
      </a>

      <a href="{{ '/03-analysis.html' | relative_url }}">
        3. Analysis
      </a>

      <a href="{{ '/04-results.html' | relative_url }}">
        4. Results
      </a>

      <a href="{{ '/05-conclusion.html' | relative_url }}">
        5. Conclusion
      </a>
    </nav>

  </aside>


  <main class="tutorial-content">

    {{ content }}

    <div class="tutorial-navigation">

      {% if page.previous %}
        <a href="{{ page.previous | relative_url }}">
          ← Previous
        </a>
      {% endif %}

      <a href="{{ '/' | relative_url }}">
        Tutorial Home
      </a>

      {% if page.next %}
        <a href="{{ page.next | relative_url }}">
          Next →
        </a>
      {% endif %}

    </div>

  </main>

</div>


<style>

.tutorial-container {
  display: flex;
  gap: 40px;
}

.tutorial-sidebar {
  width: 190px;
  flex-shrink: 0;
}

.tutorial-sidebar h3 {
  margin-top: 0;
}

.tutorial-sidebar nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tutorial-sidebar a {
  text-decoration: none;
}

.tutorial-sidebar a:hover {
  text-decoration: underline;
}

.tutorial-content {
  flex: 1;
  min-width: 0;
}

.tutorial-navigation {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #ddd;
}

@media screen and (max-width: 720px) {

  .tutorial-container {
    display: block;
  }

  .tutorial-sidebar {
    width: 100%;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #ddd;
  }

}

</style>
